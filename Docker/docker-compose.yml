services:
  kutfast:
    image: kutfast:latest
    # Or build locally:
    # build: .
    container_name: kutfast

    ports:
      - "8080:8080"
      # To serve on port 80/443, put a reverse proxy (Nginx, Traefik, Caddy)
      # in front of this container instead of exposing directly.

    volumes:
      # Persist config, data files, and uploaded audio
      - kutfast_data:/data

    environment:
      # ── Required ──────────────────────────────────────────
      APP_PASSWORD:            "change_me_now"
      KUTPOD_URL:            "https://your-kutpod.com"
      KUTPOD_API_USER:       "your_api_username"
      KUTPOD_API_PASSWORD:   "your_api_password"
      KUTPOD_PODCAST_HANDLE: "my-podcast"
      KUTPOD_USER_ID:        "1"

      # ── Optional ──────────────────────────────────────────
      APP_TIMEZONE:    "UTC"       # e.g. Europe/Madrid, America/New_York
      KUTPOD_DEBUG:  "false"
      MAX_AUDIO_SIZE:  "536870912" # 512 MB in bytes

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  kutfast_data:
    driver: local
