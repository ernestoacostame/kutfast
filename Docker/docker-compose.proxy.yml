services:
  kutfast:
    build: .
    container_name: kutfast
    # Don't expose port directly - Nginx proxy handles it
    expose:
      - "8080"

    volumes:
      - kutfast_data:/data

    environment:
      APP_PASSWORD:            "change_me_now"
      KUTPOD_URL:            "https://your-kutpod.com"
      KUTPOD_API_USER:       "your_api_username"
      KUTPOD_API_PASSWORD:   "your_api_password"
      KUTPOD_PODCAST_HANDLE: "my-podcast"
      KUTPOD_USER_ID:        "1"
      APP_TIMEZONE:            "UTC"

    restart: unless-stopped

  nginx-proxy:
    image: nginx:alpine
    container_name: kutfast-proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/proxy.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - kutfast
    restart: unless-stopped

volumes:
  kutfast_data:
    driver: local
