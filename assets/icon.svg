<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3d9be9"/>
      <stop offset="100%" stop-color="#1d6fb8"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f06050"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="128" fill="#0f1117"/>
  <!-- Soundwave circle accent -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#grad)" stroke-width="8" opacity="0.25"/>
  <circle cx="256" cy="256" r="130" fill="none" stroke="url(#grad)" stroke-width="8" opacity="0.45"/>
  <!-- Microphone body -->
  <rect x="216" y="140" width="80" height="150" rx="40" fill="url(#grad)"/>
  <!-- Mic base -->
  <path d="M166 230 C166 310, 346 310, 346 230" fill="none" stroke="#e8eaed" stroke-width="20" stroke-linecap="round"/>
  <line x1="256" y1="315" x2="256" y2="375" stroke="#e8eaed" stroke-width="20" stroke-linecap="round"/>
  <line x1="206" y1="375" x2="306" y2="375" stroke="#e8eaed" stroke-width="20" stroke-linecap="round"/>
  <!-- Fast indicator flash / live dot -->
  <circle cx="340" cy="150" r="18" fill="url(#glow)"/>
</svg>
